[pytest]
testpaths = tests/test_yue2_fix9.py tests/test_yue2_mutations.py
pythonpath = .
addopts = --import-mode=importlib --confcutdir=tests
markers =
    unit: fast isolated symbolic checks
    corpus: complete manifest-verified real corpus
    extended: exhaustive policy and recovery matrix
    upstream: independent checker required


junit_family = legacy
