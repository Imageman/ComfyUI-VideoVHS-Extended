name: YuE2 symbolic regression
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'
jobs:
  fast:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.0.2 tqdm
      - run: python -m pytest -c pytest_yue2.ini -m unit -q
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.0.2 tqdm
      - run: python -m pytest -c pytest_yue2.ini -m corpus --junitxml=tmp/corpus.xml -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-audit
          path: tmp/
  extended:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.0.2 tqdm
      - run: python -m pytest -c pytest_yue2.ini -m extended --representative --junitxml=tmp/extended.xml -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-audit
          path: tmp/

